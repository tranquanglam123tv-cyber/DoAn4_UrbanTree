<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="50%" stop-color="#12352A" />
      <stop offset="100%" stop-color="#0B2019" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8F3DC" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blockchain Network Grid lines in background -->
  <g opacity="0.12" stroke="#B7E4C7" stroke-width="2" stroke-dasharray="4 8">
    <circle cx="256" cy="256" r="210" fill="none" />
    <circle cx="256" cy="256" r="140" fill="none" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
    <line x1="108" y1="108" x2="404" y2="404" />
    <line x1="404" y1="108" x2="108" y2="404" />
  </g>

  <!-- Outer Protective Shield Outline (Representing Data Security & Blockchain Verification) -->
  <path d="M256 70 C345 92 410 115 410 180 C410 295 330 385 256 438 C182 385 102 295 102 180 C102 115 167 92 256 70 Z" 
        fill="none" stroke="#52B788" stroke-width="6" opacity="0.35" />

  <!-- Tree Canopy / Eco Layers (Modern Polygon & Organic Fusion) -->
  <!-- Upper Canopy Layer -->
  <path d="M256 110 L335 205 H177 Z" fill="url(#leafGrad2)" filter="url(#glow)" opacity="0.95" />
  <!-- Middle Canopy Layer -->
  <path d="M256 165 L365 290 H147 Z" fill="url(#leafGrad1)" opacity="0.95" />
  <!-- Base Canopy Layer -->
  <path d="M256 220 L395 365 H117 Z" fill="url(#leafGrad2)" opacity="0.9" />

  <!-- Smart Tree Trunk & Digital Data Nodes (Fusion of Tree + Blockchain / QR) -->
  <path d="M246 360 L246 425 H266 L266 360 Z" fill="url(#trunkGrad)" />

  <!-- QR Corner Markings inside trunk & canopy base -->
  <!-- QR Pattern Block 1 (Left Root) -->
  <rect x="175" y="380" width="36" height="36" rx="6" fill="#2D6A4F" stroke="#95D5B2" stroke-width="3" />
  <rect x="185" y="390" width="16" height="16" rx="3" fill="#D8F3DC" />

  <!-- QR Pattern Block 2 (Right Root) -->
  <rect x="301" y="380" width="36" height="36" rx="6" fill="#2D6A4F" stroke="#95D5B2" stroke-width="3" />
  <rect x="311" y="390" width="16" height="16" rx="3" fill="#D8F3DC" />

  <!-- Central Digital Node (On-chain Anchor Point) -->
  <circle cx="256" cy="275" r="16" fill="#081C15" stroke="#74C69D" stroke-width="5" />
  <circle cx="256" cy="275" r="7" fill="#D8F3DC" />

  <!-- Connecting Data Lines from Canopy to Node -->
  <line x1="256" y1="215" x2="256" y2="259" stroke="#D8F3DC" stroke-width="4" stroke-linecap="round" />
  <line x1="210" y1="250" x2="242" y2="268" stroke="#74C69D" stroke-width="3" stroke-linecap="round" />
  <line x1="302" y1="250" x2="270" y2="268" stroke="#74C69D" stroke-width="3" stroke-linecap="round" />

  <!-- Small Satellite Blockchain Hex Nodes -->
  <circle cx="160" cy="180" r="8" fill="#52B788" />
  <circle cx="352" cy="180" r="8" fill="#52B788" />
  <circle cx="256" cy="108" r="9" fill="#B7E4C7" />
</svg>
